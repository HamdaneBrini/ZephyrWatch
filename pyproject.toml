[project]
name = "zephyrwatch"
version = "0.1.0"
description = "Real-time activity-tracking smartwatch firmware built with Zephyr RTOS"
readme = "README.md"
authors = [
    { name = "HamdaneBrini", email = "hamdenbrini01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.7.0",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
