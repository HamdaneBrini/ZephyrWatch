# Display, touch input, and LVGL
CONFIG_DISPLAY=y
CONFIG_INPUT=y
# The board's touch interrupt is unreliable, so poll the CST816S instead.
# Startup code disables controller auto-sleep to keep polling responsive.
CONFIG_INPUT_CST8XX_INTERRUPT=n
CONFIG_INPUT_CST8XX_PERIOD_MS=20
CONFIG_LVGL=y

# Memory for the LVGL objects and the application thread
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096

# Watch fonts: small UI text, headings, and the clock
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# Theme and layout
CONFIG_LV_USE_THEME_DEFAULT=y
CONFIG_LV_THEME_DEFAULT_DARK=y
CONFIG_LV_USE_FLEX=y

# Widgets used by the planned watch interface
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_CHART=y
CONFIG_LV_USE_SCALE=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_TILEVIEW=y

# Sensors
CONFIG_SENSOR=y
CONFIG_QMI8658A=y
CONFIG_QMI8658A_TRIGGER_OWN_THREAD=y
